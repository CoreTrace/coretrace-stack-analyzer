# SPDX-License-Identifier: Apache-2.0
name: Build Release Binaries

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - "main"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-binaries:
    name: Build Linux binary (${{ matrix.arch }})
    # Each architecture builds on its own native runner. Emulating arm64 through
    # QEMU cost 17-24 minutes against 3 minutes for native amd64; arm64 runners
    # are free and unlimited on public repositories.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve artifact version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short=12 HEAD)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="sha-${short_sha}"
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      # No QEMU: matrix.platform always matches the runner's own architecture.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Layer cache: the LLVM install depends only on LLVM_VERSION and the base
      # image, so a warm cache skips it entirely and never contacts
      # apt.llvm.org — which is where these builds intermittently fail.
      # build-push-action is used rather than a raw `docker buildx build` so the
      # Actions runtime credentials that type=gha needs are provided; a plain
      # run: step does not have them. publish-docker.yml already uses it.
      - name: Build packaged binary with Buildx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release-binaries
          target: artifacts
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,scope=release-${{ matrix.arch }},mode=max
          outputs: type=local,dest=dist/${{ matrix.arch }}

      - name: Show build output
        shell: bash
        run: ls -la "dist/${{ matrix.arch }}"

      - name: Validate artifact files
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="dist/${{ matrix.arch }}"
          archive="${artifact_dir}/coretrace-stack-analyzer-${{ steps.version.outputs.value }}-linux-${{ matrix.arch }}.tar.gz"
          checksum="${archive}.sha256"
          test -f "${archive}" || { echo "missing archive: ${archive}"; exit 1; }
          test -f "${checksum}" || { echo "missing checksum: ${checksum}"; exit 1; }
          (
            cd "${artifact_dir}"
            sha256sum -c "$(basename "${checksum}")"
          )

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coretrace-stack-analyzer-${{ steps.version.outputs.value }}-linux-${{ matrix.arch }}
          path: |
            dist/${{ matrix.arch }}/*.tar.gz
            dist/${{ matrix.arch }}/*.sha256
          if-no-files-found: error

  publish-release-assets:
    name: Attach binaries to GitHub Release
    runs-on: ubuntu-24.04
    needs: build-linux-binaries
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coretrace-stack-analyzer-*-linux-*
          path: dist
          merge-multiple: true

      - name: Show release files
        shell: bash
        run: |
          set -euo pipefail
          ls -la dist

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
