# SPDX-License-Identifier: Apache-2.0
#
# The experimental check of const parameter suggestions, enabled by
# --experimental-const-suggestion-check, is off by default; ci.yml checks the default behavior.
# This workflow runs the check's tests with the option, on Linux and macOS: the const-suggestion
# fixtures and checks of run_test.py, which expect suggestions kept once checked, suggestions
# removed, and suggestions kept as not checked.
#
# Scope: this repository's fixtures, with their compile commands, built with the LLVM 20 of each
# runner. It does not check this repository's sources, other projects or configurations, nor any
# analysis run without the option.
name: Experimental const suggestion check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: const-suggestion-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  const-suggestion-check:
    name: Experimental const suggestion check on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    # The toolchains of ci.yml.
    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake python3 \
          ninja-build ccache lld libz3-dev pkg-config
        wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
        UBUNTU_CODENAME=$(lsb_release -cs)
        sudo apt-add-repository "deb http://apt.llvm.org/${UBUNTU_CODENAME}/ llvm-toolchain-${UBUNTU_CODENAME}-20 main"
        sudo apt-get update
        sudo apt-get install -y llvm-20 llvm-20-dev clang-20 libclang-20-dev
        echo "LLVM_DIR=/usr/lib/llvm-20/lib/cmake/llvm" >> $GITHUB_ENV
        echo "Clang_DIR=/usr/lib/llvm-20/lib/cmake/clang" >> $GITHUB_ENV

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install cmake python llvm@20 ninja ccache z3
        echo "LLVM_DIR=$(brew --prefix llvm@20)/lib/cmake/llvm" >> $GITHUB_ENV
        echo "Clang_DIR=$(brew --prefix llvm@20)/lib/cmake/clang" >> $GITHUB_ENV
        echo "$(brew --prefix llvm@20)/bin" >> $GITHUB_PATH

    # Reads the ccache that ci.yml saves; saving it is left to ci.yml.
    - name: Restore ccache
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('CMakeLists.txt', 'src/**', 'include/**') }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ github.ref_name }}-
          ccache-${{ runner.os }}-

    - name: Configure ccache
      run: |
        ccache --set-config=cache_dir=${{ env.CCACHE_DIR }}
        ccache --set-config=max_size=500M
        ccache --set-config=compression=true
        ccache -z

    - name: Configure
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DLLVM_DIR=${{ env.LLVM_DIR }} \
          -DClang_DIR=${{ env.Clang_DIR }} \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DUSE_SHARED_LIB=OFF \
          -DBUILD_TESTS=OFF \
          -DBUILD_ANALYZER_UNIT_TESTS=ON \
          ${{ runner.os == 'Linux' && '-DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld' || '' }}

    - name: Build
      run: cmake --build build --config Release --target stack_usage_analyzer

    - name: Check const suggestions with --experimental-const-suggestion-check
      timeout-minutes: 20
      run: python3 -u scripts/ci/run_const_suggestion_check.py
